# Valores solo para tests. Nunca se usan fuera del classpath de test.
# El datasource en sí proviene del PostgreSQL compartido de Testcontainers (@ServiceConnection).
app.auth.username=demo-test-user
app.auth.password=demo-test-password-not-a-secret
app.jwt.secret-base64=dGVzdC1vbmx5LXNlY3JldC1rZXktd2l0aC1hdC1sZWFzdC02NC1ieXRlcy0wMTIzNDU2Nzg5LWFiY2RlZmdoaWprbG1ubw==
app.jwt.issuer=https://star-wars-api.test
app.jwt.audience=star-wars-api-test
app.jwt.ttl-seconds=600
app.cors.allowed-origins=http://localhost:4200
# Lo bastante alto para que las suites que inician sesión repetidamente nunca reciban 429; los tests de rate limit lo sobrescriben.
app.rate-limit.login.capacity=100000
app.rate-limit.login.period=1m
app.rate-limit.refresh.capacity=100000
app.rate-limit.refresh.period=1m
app.rate-limit.register.capacity=100000
app.rate-limit.register.period=1m
app.swapi.base-url=http://localhost:9/api
app.swapi.retry.max-retries=2
app.swapi.retry.delay=1ms
# Umbrales inalcanzables para que los tests de fallos de SWAPI no abran el breaker en un contexto compartido; sus propios tests lo sobrescriben.
app.swapi.circuit-breaker.failure-rate-threshold=100
app.swapi.circuit-breaker.sliding-window-size=1000
app.swapi.circuit-breaker.minimum-number-of-calls=1000
app.swapi.circuit-breaker.wait-duration-in-open-state=30s
app.swapi.circuit-breaker.permitted-calls-in-half-open-state=1
