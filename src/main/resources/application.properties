spring.application.name=star-wars-api
# Se aplica al RestClient que habla con swapi.tech: ninguna llamada puede bloquear una petición indefinidamente.
spring.http.clients.connect-timeout=${SWAPI_CONNECT_TIMEOUT:3s}
spring.http.clients.read-timeout=${SWAPI_READ_TIMEOUT:8s}

server.port=${PORT:8083}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Sin contraseña por defecto: sin DB_PASSWORD PostgreSQL rechaza la conexión al arrancar.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:starwars}
spring.datasource.username=${DB_USER:starwars}
spring.datasource.password=${DB_PASSWORD:}
# Flyway es dueño del esquema; Hibernate solo comprueba que las entidades coincidan con él.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.swapi.base-url=${SWAPI_BASE_URL:https://www.swapi.tech/api}
app.swapi.page-size=10
# Intervalo de refresco de los catálogos cacheados de swapi.tech (people, films, starships, vehicles): pasado este tiempo
# se sigue sirviendo el catálogo anterior mientras se recarga en segundo plano; si la recarga falla, se conserva el anterior
# y el siguiente intento ocurre pasado otro intervalo. Las recargas pasan por el circuit breaker.
app.swapi.catalog-ttl=${SWAPI_CATALOG_TTL:1h}
# Reintenta solo fallos transitorios (5xx, errores de conexión), nunca 429, otros 4xx, cuerpos inválidos ni timeouts.
app.swapi.retry.max-retries=${SWAPI_RETRY_MAX_RETRIES:2}
app.swapi.retry.delay=${SWAPI_RETRY_DELAY:200ms}
# Circuit breaker frente a SWAPI (ventana por número de llamadas). Cuenta 5xx, timeouts, errores de conexión y cuerpos ilegibles,
# una vez por operación (después de los reintentos); nunca los 4xx ni el 429. Abierto, responde 503 sin llamar a SWAPI.
app.swapi.circuit-breaker.failure-rate-threshold=${SWAPI_CB_FAILURE_RATE_THRESHOLD:50}
app.swapi.circuit-breaker.sliding-window-size=${SWAPI_CB_SLIDING_WINDOW_SIZE:10}
app.swapi.circuit-breaker.minimum-number-of-calls=${SWAPI_CB_MINIMUM_NUMBER_OF_CALLS:5}
app.swapi.circuit-breaker.wait-duration-in-open-state=${SWAPI_CB_WAIT_DURATION:30s}
app.swapi.circuit-breaker.permitted-calls-in-half-open-state=${SWAPI_CB_HALF_OPEN_CALLS:2}
# Las credenciales y la clave de firma son obligatorias: el valor por defecto vacío hace fallar la validación al arrancar en lugar de enlazar
# el marcador literal.
app.auth.username=${APP_AUTH_USERNAME:}
app.auth.password=${APP_AUTH_PASSWORD:}
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=${JWT_ISSUER:star-wars-api}
app.jwt.audience=${JWT_AUDIENCE:star-wars-client}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
# Duración de la sesión contada desde el login: los refresh tokens se rotan pero conservan la expiración original.
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:7d}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Por IP de cliente y endpoint, en memoria (por instancia). Solo POST /api/v1/auth/{login,refresh,register}.
app.rate-limit.login.capacity=5
app.rate-limit.login.period=1m
app.rate-limit.refresh.capacity=10
app.rate-limit.refresh.period=1m
app.rate-limit.register.capacity=5
app.rate-limit.register.period=1h
# Detrás de un proxy inverso (Render) la IP del cliente viene de X-Forwarded-For, resuelta por el RemoteIpValve de Tomcat.
# Tomcat solo confía por defecto en los rangos de proxies privados/loopback; se puede cambiar con server.tomcat.remoteip.internal-proxies.
server.forward-headers-strategy=native

# Nivel de log de la aplicación y de las llamadas salientes a SWAPI (INFO, DEBUG, TRACE...). Con DEBUG se registra una línea por
# intento de llamada (método, URI, estado, duración), los listados, los detalles y las cargas de catálogo.
logging.level.com.challenge.starwars=${APP_LOG_LEVEL:INFO}
logging.level.com.challenge.starwars.clients=${SWAPI_LOG_LEVEL:INFO}

# El endpoint loggers (cambio de niveles en caliente) no se expone: cualquiera puede registrarse y obtener un token válido, y
# la API no tiene un rol de administrador. SecurityConfig lo bloquea además con denyAll. Los niveles se cambian con las variables de arriba.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Versionado de la API por segmento de ruta: /api/v1/... (el segmento con índice 1 es la versión; los mapeos declaran /api/{version}/...).
# Una petición sin versión o con una versión no soportada se rechaza con 400 antes de llegar al controlador.
spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.required=true
